<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ab8c8"/>
      <stop offset="100%" stop-color="#e8b44a"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="64" height="64" rx="14" fill="#0e1117"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="13" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- drafting compass mark -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- pivot -->
    <circle cx="32" cy="16" r="3" fill="url(#g)"/>
    <!-- left leg -->
    <path d="M32 16 L18 50" stroke="url(#g)" stroke-width="4"/>
    <!-- right leg -->
    <path d="M32 16 L46 50" stroke="#e8e6df" stroke-width="4"/>
    <!-- left foot point -->
    <circle cx="18" cy="50" r="2.4" fill="url(#g)"/>
    <!-- right foot (pencil) -->
    <circle cx="46" cy="50" r="2.4" fill="#e8e6df"/>
    <!-- arc sweep -->
    <path d="M20 42 A 14 14 0 0 0 44 42" stroke="#7a8494" stroke-width="2" stroke-dasharray="3 4"/>
  </g>
</svg>
